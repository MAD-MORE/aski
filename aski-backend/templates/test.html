<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASKI AI Test</title>
  <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px}textarea{width:100%;box-sizing:border-box;min-height:120px;padding:12px;font-size:16px}button{margin-top:12px;padding:12px 18px;font-size:16px}#answer{white-space:pre-wrap;margin-top:20px;padding:16px;background:#f4f4f4;border-radius:10px}a{overflow-wrap:anywhere}</style>
</head>
<body>
  <h1>ASKI AI Test</h1>
  <p>Ask a question and test ASKI's UCC RAG pipeline.</p>
  <textarea id="question" maxlength="2000" placeholder="When does the next semester begin?"></textarea>
  <button id="ask">Ask ASKI</button>
  <div id="answer"></div>
  <script>
    const q=document.getElementById('question'), out=document.getElementById('answer');
    document.getElementById('ask').onclick=async()=>{
      const question=q.value.trim(); if(!question)return;
      out.textContent='Thinking...';
      try{
        const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||'Request failed');
        out.innerHTML='';
        const answer=document.createElement('div'); answer.textContent=data.answer||''; out.appendChild(answer);
        if(Array.isArray(data.sources)&&data.sources.length){
          const h=document.createElement('h3'); h.textContent='Sources'; out.appendChild(h);
          data.sources.forEach(s=>{const p=document.createElement('p'); const a=document.createElement('a'); a.href=s.url||'#'; a.textContent=s.title||s.url||'Source'; a.target='_blank'; a.rel='noopener noreferrer'; p.appendChild(a); out.appendChild(p);});
        }
      }catch(e){out.textContent='Error: '+e.message;}
    };
  </script>
</body>
</html>
