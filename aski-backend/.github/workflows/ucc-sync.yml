name: ASKI UCC Knowledge Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: aski-backend
        run: pip install -r requirements.txt

      - name: Run UCC sync
        working-directory: aski-backend
        env:
          ASKI_SYNC_API_URL: ${{ secrets.ASKI_SYNC_API_URL }}
          ASKI_SYNC_API_TOKEN: ${{ secrets.ASKI_SYNC_API_TOKEN }}
        run: python scripts/sync_ucc.py
