name: ASKI Backend Tests

on:
  push:
    paths:
      - "aski-backend/**"
  pull_request:
    paths:
      - "aski-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aski-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
