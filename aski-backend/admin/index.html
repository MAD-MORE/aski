<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASKI Admin</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px}section{padding:20px;border:1px solid #ddd;border-radius:12px;margin:15px 0}button{padding:10px 15px}</style></head><body><h1>ASKI Admin</h1><section><h2>Knowledge</h2><p id="count">Loading…</p><button onclick="load()">Refresh</button></section><section><h2>UCC Sync</h2><p>Use the protected API endpoint to run synchronization.</p></section><script>async function load(){const token=prompt('Admin token');if(!token)return;const r=await fetch('/api/admin/knowledge',{headers:{Authorization:'Bearer '+token}});const d=await r.json();document.querySelector('#count').textContent=(d.count??0)+' knowledge documents';}load();</script></body></html>
